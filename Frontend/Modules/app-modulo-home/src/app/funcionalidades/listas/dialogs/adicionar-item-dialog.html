<h2 mat-dialog-title class="dialog-titulo">
    <mat-icon>add_shopping_cart</mat-icon>
    Adicionar Item
</h2>

<p class="dialog-subtitulo">📋 {{ data.listaNome }}</p>

<mat-dialog-content class="dialog-content">

    <!-- Erro -->
    <div class="erro-banner" *ngIf="erro">
        <mat-icon>warning</mat-icon>
        <span>{{ erro }}</span>
    </div>

    <!-- Nome do Produto -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome do produto *</mat-label>
        <mat-icon matPrefix>shopping_basket</mat-icon>
        <input matInput [(ngModel)]="nomeProduto" placeholder="Ex: Arroz, Feijão, Leite..." maxlength="200"
            [disabled]="salvando">
    </mat-form-field>

    <!-- Quantidade e Unidade - lado a lado -->
    <div class="row-campos">
        <mat-form-field appearance="outline" class="campo-qtd">
            <mat-label>Qtd. *</mat-label>
            <input matInput type="number" [(ngModel)]="quantidade" min="0.001" step="0.5" [disabled]="salvando">
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo-unidade">
            <mat-label>Unidade</mat-label>
            <mat-select [(ngModel)]="unidadeMedida" [disabled]="salvando || carregandoUnidades">
                <mat-option *ngIf="carregandoUnidades" disabled>Carregando...</mat-option>
                <mat-option *ngFor="let u of unidades" [value]="u.sigla">{{ u.descricao }} ({{ u.sigla }})</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <!-- Categoria (opcional) -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Categoria (opcional)</mat-label>
        <mat-icon matPrefix>label</mat-icon>
        <input matInput [(ngModel)]="categoriaNome" placeholder="Ex: Laticínios, Hortifruti..." maxlength="100"
            [disabled]="salvando">
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button (click)="cancelar()" [disabled]="salvando">Cancelar</button>
    <button mat-raised-button color="primary" (click)="adicionar()" [disabled]="!formularioValido || salvando"
        class="btn-adicionar">
        <mat-spinner diameter="18" *ngIf="salvando"></mat-spinner>
        <mat-icon *ngIf="!salvando">add</mat-icon>
        {{ salvando ? 'Adicionando...' : 'Adicionar' }}
    </button>
</mat-dialog-actions>
